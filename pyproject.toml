[build-system]
requires = ["setuptools>=60.0", "wheel", "numpy==1.18.3", "cython==0.29.14", "requests", "future", "six"]
build-backend = "setuptools.build_meta"

[project]
name = "moseq2_model"
description = "Modeling for the best"
authors = [
    {name = "Datta Lab"}
]
readme = "README.md"
requires-python = ">=3.6"
dynamic = ["version"]
dependencies = [
    "h5py==2.10.0",
    "scipy==1.3.2",
    "numpy==1.18.3",
    "click==7.0",
    "pandas==1.0.5",
    "joblib==0.15.1",
    "scikit-image==0.16.2",
    "cytoolz==0.10.1",
    "tqdm>=4.48.0",
    "matplotlib==3.1.2",
    "statsmodels==0.10.2",
    "ruamel-yaml==0.16.5",
    "opencv-python==4.1.2.30",
    "pyhsmm @ git+https://github.com/mattjj/pyhsmm.git#egg=master",
    "pybasicbayes @ git+https://github.com/mattjj/pybasicbayes.git#egg=master",
    "autoregressive @ git+https://github.com/dattalab/pyhsmm-autoregressive.git#egg=master",
]

[project.urls]
Homepage = "https://github.com/dattalab/moseq2-model"  # Update with actual URL if different

[project.scripts]
moseq2-model = "moseq2_model.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "moseq2_model.__version__"}

[tool.setuptools]
packages = ["moseq2_model"]
include-package-data = true
